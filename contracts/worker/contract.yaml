contract: worker.execution
contract_version: "1.0.0"
core_references:
  envelope: core.message-envelope
  errors: core.error
  identifiers: core.identifiers
  status: core.operation-status
request:
  required: [execution_id, worker_id, artifact_id, artifact_hash, entrypoint, input_payload, configuration]
  optional: [timeout_seconds, idempotency_key, parent_execution_id, depth]
response:
  required: [execution_id, worker_id, accepted, status]
  optional: [result, error, children]
status_values: [accepted, running, succeeded, failed, cancelled]
error_required: [code, message]
cancellation:
  operation: cancel_execution
  required: [execution_id]
  semantics: "Best-effort cancellation of active execution and descendants; terminal results are immutable."
concurrency:
  capacity_exceeded_error: CAPACITY_EXCEEDED
  duplicate_execution_error: EXECUTION_CONFLICT
  idempotency_conflict_error: IDEMPOTENCY_CONFLICT
limits:
  max_depth: configurable
  max_children: configurable
  timeout_budget: shared_with_descendants
artifact_provider:
  interface: "fetch(artifact_id) -> bytes"
  verification: sha256
  code_manager_api: "GET /artifacts/{artifact_id}/content (not yet implemented by CODE MANAGER)"
security:
  sandbox: false
  note: "Subprocess is not a production security boundary."
