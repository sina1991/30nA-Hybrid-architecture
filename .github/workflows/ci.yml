name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Contracts, services and real Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Build immutable Sandbox test image
        run: |
          docker build -t worker-runtime-sandbox-test -f units/worker-runtime/tests/sandbox-image/Dockerfile .
          echo "WORKER_RUNTIME_SANDBOX_TEST_IMAGE=$(docker image inspect --format '{{.Id}}' worker-runtime-sandbox-test)" >> "$GITHUB_ENV"
      - name: Run complete suites against an owned disposable DATA MANAGER
        run: python scripts/testing/run_ci.py --evidence-dir verification-logs
      - name: Upload test and revision evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.python }}-${{ github.sha }}
          path: verification-logs/
          if-no-files-found: warn
  security:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install hash-locked audit tooling
        run: python -m pip install --require-hashes -r requirements-security.lock
      - name: Audit application and development lockfile
        run: python -m pip_audit -r requirements.lock --no-deps --disable-pip --strict
      - name: Install checksum-verified Gitleaks
        run: python scripts/security/install_gitleaks.py --output "$RUNNER_TEMP/gitleaks"
      - name: Scan repository history without exposing findings
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner'
