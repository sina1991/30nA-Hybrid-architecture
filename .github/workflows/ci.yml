name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: units/code-manager:units/worker-manager:units/worker-runtime:units/consumers/dashboard-core
      CODE_MANAGER_INTEGRATION: "0"
      DATA_MANAGER_ALLOW_INSECURE_HEADER: "0"
      CODE_MANAGER_ALLOW_INSECURE_HEADER: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run all contract and unit suites
        run: |
          python -m pytest \
            contracts/core/tests \
            contracts/code/tests \
            units/data-manager/tests \
            units/code-manager/tests \
            units/worker-manager/tests \
            units/worker-runtime/tests \
            units/consumers/dashboard-core/tests \
            units/consumers/dashboard-core/legacy-tests \
            units/integration/agent08/tests \
            --import-mode=importlib -v --tb=short
