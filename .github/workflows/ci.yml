name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Contracts, services and real Docker E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install locked browser test dependency
        run: npm ci --prefix units/consumers/dashboard-core/browser-tests --ignore-scripts --no-audit --no-fund
      - name: Verify host Chrome availability
        run: command -v google-chrome || command -v chromium
      - name: Build immutable Sandbox test image
        run: |
          docker build -t worker-runtime-sandbox-test -f units/worker-runtime/tests/sandbox-image/Dockerfile .
          echo "WORKER_RUNTIME_SANDBOX_TEST_IMAGE=$(docker image inspect --format '{{.Id}}' worker-runtime-sandbox-test)" >> "$GITHUB_ENV"
      - name: Run complete suites against an owned disposable DATA MANAGER
        run: python scripts/testing/run_ci.py --evidence-dir verification-logs
      - name: Upload test and revision evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tests-${{ matrix.python }}-${{ github.sha }}
          path: verification-logs/
          if-no-files-found: warn
  security:
    name: Dependency and secret scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install hash-locked audit tooling
        run: python -m pip install --require-hashes -r requirements-security.lock
      - name: Audit browser dependency lockfile
        run: npm audit --prefix units/consumers/dashboard-core/browser-tests --audit-level=low
      - name: Audit application and development lockfile
        run: python -m pip_audit -r requirements.lock --no-deps --disable-pip --strict
      - name: Audit documentation renderer lockfile
        run: python -m pip_audit -r requirements-docs.lock --no-deps --disable-pip --strict
      - name: Install checksum-verified Gitleaks
        run: python scripts/security/install_gitleaks.py --output "$RUNNER_TEMP/gitleaks"
      - name: Scan repository history without exposing findings
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="--all --diff-merges=first-parent" --redact --no-banner'

  documentation:
    name: Handbook and Agent guide freshness, coverage and links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install hash-locked manual renderer
        run: python -m pip install --require-hashes -r requirements-docs.lock
      - name: Check generated handbook, Agent guide, inventory, PDF checksums and all local links
        run: |
          python scripts/documentation/build_manual.py --check
          python scripts/documentation/check_docs.py
